<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Street Football Chaos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap&subset=vietnamese" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hud" class="hidden"></div>
    <div id="banner"></div>
    <div id="toasts"></div>
    <div id="menu" class="screen"></div>
    <div id="draft" class="screen hidden"></div>
    <div id="pause" class="screen hidden"></div>
    <div id="end" class="screen hidden"></div>
  </div>

  <!-- Config (chỉnh cân bằng game tại đây) -->
  <script src="config/game.config.js"></script>
  <script src="config/controls.config.js"></script>
  <script src="config/teams.config.js"></script>
  <script src="config/cores.config.js"></script>

  <!-- Engine -->
  <script src="src/core/utils.js"></script>
  <script src="src/core/input.js"></script>
  <script src="src/core/audio.js"></script>
  <script src="src/entities/ball.js"></script>
  <script src="src/entities/player.js"></script>
  <script src="src/systems/actions.js"></script>
  <script src="src/systems/cores.js"></script>
  <script src="src/systems/effects.js"></script>
  <script src="src/systems/ai.js"></script>
  <script src="src/systems/human.js"></script>
  <script src="src/game/match.js"></script>
  <script src="src/render/sprites.js"></script>
  <script src="src/render/background.js"></script>
  <script src="src/render/renderer.js"></script>
  <script src="src/ui/ui.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
