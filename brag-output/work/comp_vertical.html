<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --ink: #140c16; --red: #ff3d5a; --gold: #ffe14f; --cyan: #7fe7ff; --paper: #f3ead7; --px: "Press Start 2P", monospace; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #07050a; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: #07050a; }
  .plate { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; image-rendering: pixelated; }
  .plate img { display: block; width: 1920px; height: 1080px; image-rendering: pixelated; }
  /* fit mode: blurred cover background + a framed window */
  #bg { position: absolute; left: 50%; top: 0; height: 1920px; width: auto; transform: translateX(-50%) scale(1.15); filter: blur(28px) brightness(0.32) saturate(1.2); }
  #win { position: absolute; left: 0; width: 1080px; overflow: hidden; border-top: 6px solid var(--ink); border-bottom: 6px solid var(--ink);
    box-shadow: 0 0 0 4px rgba(255,225,79,0.0), 0 30px 80px rgba(0,0,0,0.6); }
  #dim, #flash, #card { position: absolute; inset: 0; pointer-events: none; }
  #dim { background: radial-gradient(ellipse at center, rgba(7,5,10,0.55), rgba(7,5,10,0.92)); opacity: 0; }
  #flash { background: #fff; opacity: 0; }
  #fade { position: absolute; left: 0; right: 0; bottom: 0; height: 420px; background: linear-gradient(rgba(7,5,10,0), #07050a 70%); opacity: 0; pointer-events: none; }
  #card { background: var(--red); opacity: 0; display: flex; align-items: center; justify-content: center; }
  .layer { position: absolute; inset: 0; pointer-events: none; }

  .band { position: absolute; left: 50%; display: flex; align-items: center; justify-content: center; white-space: nowrap; text-align: center;
    font-family: var(--px); color: #fff; text-transform: uppercase; line-height: 1.35; }
  .band .bg { position: absolute; inset: 0; background: var(--ink); border-top: 8px solid var(--c, var(--gold)); border-bottom: 8px solid var(--c, var(--gold)); }
  .band span { position: relative; padding: 34px 48px 30px; text-shadow: 6px 6px 0 var(--ink); }

  .tag { position: absolute; left: 64px; bottom: 430px; font-family: var(--px); display: flex; flex-direction: column; gap: 18px; }
  .tag .k { font-size: 26px; color: var(--ink); background: var(--gold); padding: 10px 14px 8px; align-self: flex-start; }
  .tag .n { font-size: 60px; color: #fff; text-shadow: 6px 6px 0 var(--ink), 10px 10px 0 var(--c, var(--red)); }

  .logo { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--px); line-height: 1.15; }
  .logo .l1 { font-size: 60px; color: #fff; text-shadow: 6px 6px 0 var(--ink); }
  .logo .l3 { font-size: 184px; color: var(--red); text-shadow: 8px 8px 0 var(--ink), 16px 16px 0 #ffcf3f; margin-top: 18px; }
  .big { font-family: var(--px); color: #fff; text-shadow: 10px 10px 0 var(--ink); text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<div id="stage">
  <img id="bg">
  <div id="full" class="plate"><img id="img"></div>
  <div id="win"><div id="wplate" class="plate"><img id="wimg"></div></div>
  <div id="dim"></div>
  <div id="fade"></div>
  <div id="txt" class="layer"></div>
  <div id="card"></div>
  <div id="flash"></div>
</div>
<script>
const FPS = 30, W = 1080, H = 1920, FW = 1920, FH = 1080;   // viewport (vertical) / captured frame
const META = {};
async function loadMeta(names) { for (const n of names) META[n] = await (await fetch(`frames/${n}/meta.json`)).json(); }

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = (k) => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
const easeBack = (k) => { k = clamp(k, 0, 1); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const smooth = (k) => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };

/* ---------- edit decision list (same timeline as the landscape cut) ----------
 * full-bleed: z >= FH/H... i.e. view height H/z must fit inside the 1080px frame -> z >= 1.78
 * fit: { h } = framed window of height h, centered at y = 900, blurred cover background behind it */
const CUT_IN = { fit: { h: 760 }, cam: { z: 0.7, fx: 320, fy: 172 } };
const SEGS = [
  { v0: 0.00, v1: 2.60, clip: 'hook', c0: 0.00, cam: { follow: true, z: 2.0, smooth: 0.14 }, punchAt: [0.90] },
  { v0: 2.60, v1: 4.90, clip: 'chaos', c0: 0.50, cam: { z: 1.78, fx: 320, fy: 195 }, dim: 1 },
  { v0: 4.90, v1: 7.00, clip: 'draft', c0: 0.35, cam: { z: 1.9, fy: 180, keys: [[0.35, 158], [0.85, 158], [1.0, 321], [1.45, 321], [1.6, 484]] } },
  { v0: 7.00, v1: 8.10, card: 'ACHIEVE<br>MYSTIC<br>MOVEMENTS', size: 96 },
  Object.assign({ v0: 8.10, v1: 8.45, clip: 'ult_meteor', c0: 0.45 }, CUT_IN),
  { v0: 8.45, v1: 9.52, clip: 'ult_meteor', c0: 1.30, cam: { follow: true, z: 1.9, smooth: 0.28 } },
  { v0: 9.52, v1: 10.25, clip: 'ult_meteor', c0: 2.37, fit: { h: 1000 }, cam: { z: 0.95, fx: 420, fy: 170 }, punchAt: [9.52] },
  Object.assign({ v0: 10.25, v1: 10.55, clip: 'ult_fists', c0: 0.45 }, CUT_IN),
  { v0: 10.55, v1: 11.95, clip: 'ult_fists', c0: 0.95, cam: { follow: true, z: 2.4, smooth: 0.2 } },
  Object.assign({ v0: 11.95, v1: 12.25, clip: 'ult_drop', c0: 0.50 }, CUT_IN),
  { v0: 12.25, v1: 13.35, clip: 'ult_drop', c0: 1.90, fit: { h: 1000 }, cam: { follow: true, z: 0.95, smooth: 0.2 }, punchAt: [12.65] },
  Object.assign({ v0: 13.35, v1: 13.65, clip: 'ult_titan', c0: 0.50 }, CUT_IN),
  { v0: 13.65, v1: 15.05, clip: 'ult_titan', c0: 1.05, cam: { follow: true, z: 2.0, smooth: 0.15 } },
  { v0: 15.05, v1: 16.85, clip: 'gacha', c0: 0.45, fit: { h: 700 }, cam: { z: 1.0, fx: 320, fy: 75, drift: 0.05 } },
  { v0: 16.85, v1: 17.45, clip: 'gacha', c0: 2.45, fit: { h: 900 }, cam: { z: 0.8, fx: 320, fy: 150 }, punchAt: [16.85] },
  { v0: 17.45, v1: 18.85, clip: 'custom', c0: 0.10, cam: { z: 2.6, fx: 440, fy: 160, drift: 0.05 }, fade: true },
  { v0: 18.85, v1: 21.85, clip: 'chaos', c0: 3.00, cam: { z: 1.78, fx: 320, fy: 180, drift: 0.06 }, dim: 1 },
];
const DUR = 21.85;
const CUTS = SEGS.map((s) => s.v0).filter((v) => v > 0);

/* ---------- text cues ---------- */
function band(text, { t, t0, t1, size = 96, y = 1350, rot = -3, c = 'var(--gold)' }) {
  if (t < t0 || t >= t1) return '';
  const k = (t - t0) * FPS;
  const s = lerp(1.7, 1, easeBack(k / 6));
  const wipe = easeOut(k / 5);
  return `<div class="band" style="top:${y}px;--c:${c};transform:translate(-50%,-50%) rotate(${rot}deg) scale(${s})">
    <div class="bg" style="clip-path:inset(0 ${100 - wipe * 100}% 0 0)"></div><span style="font-size:${size}px">${text}</span></div>`;
}
function tag(kicker, name, c, t, t0, t1) {
  if (t < t0 || t >= t1) return '';
  const k = (t - t0) * FPS;
  const x = lerp(-900, 0, easeOut(k / 6));
  return `<div class="tag" style="--c:${c};transform:translateX(${x}px)"><div class="k">${kicker}</div><div class="n">${name}</div></div>`;
}
function logo(t, t0, y, scale = 1) {
  if (t < t0) return '';
  const k = (t - t0) * FPS;
  const s1 = lerp(2.2, 1, easeBack(k / 6));
  const k3 = k - 5;
  const s3 = k3 < 0 ? 0 : lerp(2.6, 1, easeBack(k3 / 6));
  const ph = Math.floor(((t - t0) % 1.6) / 0.4);
  const wob = [[0, 0], [3, -3], [0, 0], [-3, 3]][ph];
  return `<div class="logo" style="top:${y}px;transform:scale(${scale})">
      <div class="l1" style="transform:scale(${s1});opacity:${k >= 0 ? 1 : 0}">STREET FOOTBALL</div>
      <div class="l3" style="transform:translate(${wob[0]}px,${wob[1]}px) scale(${s3});opacity:${k3 >= 0 ? 1 : 0}">CHAOS</div></div>`;
}

function texts(t) {
  let h = '';
  // HOOK
  h += band("IT'S<br>FOOTBALL.", { t, t0: 0.08, t1: 0.90, size: 100, y: 1330, rot: -2, c: 'var(--cyan)' });
  h += band('WITH<br>CHAOS.', { t, t0: 0.95, t1: 2.60, size: 124, y: 1330, rot: -3, c: 'var(--red)' });
  // LOGO
  if (t >= 2.6 && t < 4.9) h += logo(t, 2.66, 720);
  // CORES
  h += band('BUILD YOUR OWN<br>PLAYSTYLE', { t, t0: 4.96, t1: 7.00, size: 62, y: 250, rot: -2, c: 'var(--gold)' });
  // ULTS
  h += tag('ULTIMATE 1', 'METEOR SHOT', '#ff6a1f', t, 8.46, 10.25);
  h += tag('ULTIMATE 2', 'HUNDRED FISTS', '#ff3d5a', t, 10.56, 11.95);
  h += tag('ULTIMATE 3', 'METEOR DROP', '#9d7bff', t, 12.26, 13.35);
  h += tag('ULTIMATE 4', 'TITAN', '#ffd23f', t, 13.66, 15.05);
  // CUSTOMIZE
  h += band('CUSTOMIZE<br>YOUR PLAYER', { t, t0: 15.12, t1: 18.85, size: 80, y: 1640, rot: -2, c: 'var(--cyan)' });
  // OUTRO
  if (t >= 18.85) {
    h += logo(t, 18.9, 560);
    h += band('COMING SOON', { t, t0: 19.6, t1: 99, size: 76, y: 1180, rot: -2, c: 'var(--gold)' });
  }
  return h;
}

/* ---------- camera ---------- */
const camCache = {};
function camFor(seg, c) {
  const cam = seg.cam;
  let fx = cam.fx, fy = cam.fy, z = cam.z;
  if (cam.follow) {
    const key = seg.v0;
    if (!camCache[key]) {
      const fr = META[seg.clip].frames, i0 = Math.round(seg.c0 * FPS), n = Math.ceil((seg.v1 - seg.v0) * FPS) + 2;
      const out = []; let x = null, y = null;
      for (let i = i0; i < i0 + n; i++) {
        const f = (fr[Math.min(i, fr.length - 1)] || {}).focus || { x: 320, y: 190 };
        if (x == null) { x = f.x; y = f.y - 8; }
        x += (f.x - x) * cam.smooth; y += (f.y - 8 - y) * cam.smooth;
        out.push([x, y]);
      }
      camCache[key] = out;
    }
    const arr = camCache[key], j = clamp(Math.round((c - seg.c0) * FPS), 0, arr.length - 1);
    [fx, fy] = arr[j];
  }
  if (cam.keys) {
    const K = cam.keys;
    fx = K[K.length - 1][1];
    for (let i = 0; i < K.length - 1; i++) {
      if (c <= K[0][0]) { fx = K[0][1]; break; }
      if (c >= K[i][0] && c < K[i + 1][0]) { fx = lerp(K[i][1], K[i + 1][1], smooth((c - K[i][0]) / (K[i + 1][0] - K[i][0]))); break; }
    }
  }
  if (cam.drift) z *= 1 + cam.drift * ((c - seg.c0) / Math.max(0.1, seg.v1 - seg.v0));
  return { fx, fy, z };
}
// place a 1920x1080 plate inside a viewport vw x vh (px) so frame point (fx*3, fy*3) is centered, clamped to the frame
function place(plate, vw, vh, fx, fy, z) {
  const w = vw / z, h = vh / z;
  const cx = w >= FW ? FW / 2 : clamp(fx * 3, w / 2, FW - w / 2);
  const cy = h >= FH ? FH / 2 : clamp(fy * 3, h / 2, FH - h / 2);
  plate.style.transform = `scale(${z}) translate(${-(cx - w / 2)}px, ${-(cy - h / 2)}px)`;
}

/* ---------- render one frame ---------- */
const $ = (id) => document.getElementById(id);
const imgs = { img: $('img'), wimg: $('wimg'), bg: $('bg') };
const last = {};
async function setSrc(key, src) { if (last[key] !== src) { imgs[key].src = src; await imgs[key].decode(); last[key] = src; } }
async function render(t) {
  const seg = SEGS.find((s) => t >= s.v0 && t < s.v1) || SEGS[SEGS.length - 1];
  const card = $('card'), full = $('full'), win = $('win'), bg = $('bg');
  if (seg.card) {
    const k = (t - seg.v0) * FPS;
    card.style.opacity = 1;
    card.innerHTML = `<div class="big" style="font-size:${seg.size || 120}px;transform:rotate(-3deg) scale(${lerp(1.8, 1, easeBack(k / 5))})">${seg.card}</div>`;
    full.style.visibility = win.style.visibility = bg.style.visibility = 'hidden';
  } else {
    card.style.opacity = 0; card.innerHTML = '';
    const c = seg.c0 + (t - seg.v0);
    const idx = clamp(Math.round(c * FPS), 0, META[seg.clip].frames.length - 1);
    const src = `frames/${seg.clip}/${String(idx).padStart(4, '0')}.png`;
    let { fx, fy, z } = camFor(seg, c);
    const since = Math.min(...CUTS.concat(seg.punchAt || []).map((v) => (t >= v ? t - v : 99)));
    z *= since < 0.2 ? 1 + 0.12 * (1 - easeOut(since / 0.2)) : 1;
    if (seg.fit) {
      await setSrc('wimg', src); await setSrc('bg', src);
      const h = seg.fit.h;
      win.style.top = (900 - h / 2) + 'px'; win.style.height = h + 'px';
      place($('wplate'), W, h, fx, fy, z);
      full.style.visibility = 'hidden'; win.style.visibility = bg.style.visibility = 'visible';
    } else {
      await setSrc('img', src);
      place(full, W, H, fx, fy, z);
      full.style.visibility = 'visible'; win.style.visibility = bg.style.visibility = 'hidden';
    }
  }
  $('dim').style.opacity = seg.dim || 0;
  $('fade').style.opacity = seg.fade ? 1 : 0;
  const hits = CUTS.concat(...SEGS.map((s) => s.punchAt || []));
  const fl = Math.min(...hits.map((v) => (t >= v ? t - v : 99)));
  $('flash').style.opacity = fl < 1 / FPS ? 0.85 : fl < 2 / FPS ? 0.35 : 0;
  $('txt').innerHTML = texts(t);
  await document.fonts.ready;
  return seg.clip || 'card';
}
window.ready = (async () => { await loadMeta([...new Set(SEGS.filter((s) => s.clip).map((s) => s.clip))]); await document.fonts.load('40px "Press Start 2P"'); })();
</script>
</body>
</html>
