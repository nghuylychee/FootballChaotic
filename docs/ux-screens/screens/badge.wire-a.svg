<svg class="wf" viewBox="0 0 640 360" role="img" xmlns="http://www.w3.org/2000/svg"><rect class="wf-bg" width="640" height="360"/><rect class="wf-map" x="16" y="8" width="608" height="344"/><rect class="wf-frame" x="16" y="8" width="608" height="344"/><text class="wf-txt big c acc" x="320" y="36">PICK A BADGE</text><text class="wf-txt sm c acc" x="320" y="52">The whole team gets it</text><rect class="wf-box hi" x="62" y="62" width="164" height="150"/><line class="wf-ln" x1="63" y1="63.5" x2="225" y2="63.5"/><rect class="wf-ph" x="121.0" y="72" width="46" height="46" rx="12"/><rect class="wf-ln dash" x="125.0" y="76" width="38" height="38" rx="9"/><text class="wf-txt md c ink" x="144" y="134">Kit Bag</text><text class="wf-txt sm c ink" x="144" y="154">Every player can wear</text><text class="wf-txt sm c ink" x="144" y="166">one more GEAR.</text><rect class="wf-box" x="238" y="66" width="164" height="150"/><line class="wf-ln" x1="239" y1="67.5" x2="401" y2="67.5"/><rect class="wf-ph" x="297.0" y="76" width="46" height="46" rx="12"/><rect class="wf-ln dash" x="301.0" y="80" width="38" height="38" rx="9"/><text class="wf-txt md c" x="320" y="138">VAR Monitor</text><text class="wf-txt sm c" x="320" y="158">The first goal you concede</text><text class="wf-txt sm c" x="320" y="170">each match may get</text><text class="wf-txt sm c" x="320" y="182">ruled out.</text><rect class="wf-box" x="414" y="66" width="164" height="150"/><line class="wf-ln" x1="415" y1="67.5" x2="577" y2="67.5"/><rect class="wf-ph" x="473.0" y="76" width="46" height="46" rx="12"/><rect class="wf-ln dash" x="477.0" y="80" width="38" height="38" rx="9"/><text class="wf-txt md c" x="496" y="138">Pre-Season Camp</text><text class="wf-txt sm c" x="496" y="158">Your second Core pick</text><text class="wf-txt sm c" x="496" y="170">comes before kickoff.</text><text class="wf-txt sm r mute" x="186" y="249">TEAM BADGES</text><rect class="wf-ln dash" x="196" y="238" width="16" height="16"/><rect class="wf-ln dash" x="218" y="238" width="16" height="16"/><rect class="wf-ln dash" x="240" y="238" width="16" height="16"/><rect class="wf-ln dash" x="262" y="238" width="16" height="16"/><rect class="wf-ln dash" x="284" y="238" width="16" height="16"/><rect class="wf-ln dash" x="306" y="238" width="16" height="16"/><rect class="wf-ln dash" x="328" y="238" width="16" height="16"/><rect class="wf-ln dash" x="350" y="238" width="16" height="16"/><rect class="wf-ln dash" x="372" y="238" width="16" height="16"/><rect class="wf-ln dash" x="394" y="238" width="16" height="16"/><rect class="wf-box" x="290" y="318" width="60" height="18"/><text class="wf-txt sm c" x="320" y="330">SKIP</text><g class="wf-pin"><circle cx="52" cy="72" r="7"/><text x="52" y="75">1</text></g><g class="wf-pin"><circle cx="372" cy="84" r="7"/><text x="372" y="87">2</text></g><g class="wf-pin"><circle cx="364" cy="327" r="7"/><text x="364" y="330">3</text></g></svg>