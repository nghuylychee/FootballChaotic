<svg class="wf" viewBox="0 0 640 360" role="img" xmlns="http://www.w3.org/2000/svg"><rect class="wf-bg" width="640" height="360"/><rect class="wf-map" x="0" y="0" width="640" height="360"/><text class="wf-txt big c acc" x="320" y="24">STARTING CORE  1/4</text><text class="wf-txt sm c" x="320" y="38">vs The Uncles · PLASTIC STOOLS</text><rect class="wf-box flat" x="266" y="44" width="108" height="14"/><rect class="wf-box" x="270" y="46" width="10" height="10"/><text class="wf-txt sm c" x="275" y="54">R</text><text class="wf-txt sm c" x="328" y="54">REROLL (1 left)</text><rect class="wf-box hi" x="40" y="66" width="134" height="146"/><rect class="wf-box acc" x="44" y="70" width="12" height="11"/><text class="wf-txt sm c on-acc" x="50" y="79">1</text><rect class="wf-box flat" x="75.0" y="71" width="64" height="12"/><text class="wf-txt sm c" x="107.0" y="80">TIKI-TAKA</text><rect class="wf-ph" x="42" y="88" width="130" height="56"/><g class="wf-pitch"><line x1="107.0" y1="88" x2="107.0" y2="144"/><circle cx="107.0" cy="116" r="16"/></g><text class="wf-txt md c ink" x="107.0" y="162">Maestro</text><text class="wf-txt sm c ink" x="107.0" y="178">Faster passes; the receiver</text><text class="wf-txt sm c ink" x="107.0" y="188">gets a speed boost.</text><rect class="wf-box" x="182" y="66" width="134" height="146"/><rect class="wf-box acc" x="186" y="70" width="12" height="11"/><text class="wf-txt sm c on-acc" x="192" y="79">2</text><rect class="wf-box flat" x="217.0" y="71" width="64" height="12"/><text class="wf-txt sm c" x="249.0" y="80">IRON</text><rect class="wf-ph" x="184" y="88" width="130" height="56"/><g class="wf-pitch"><line x1="249.0" y1="88" x2="249.0" y2="144"/><circle cx="249.0" cy="116" r="16"/></g><text class="wf-txt md c" x="249.0" y="162">Iron Fist</text><text class="wf-txt sm c" x="249.0" y="178">A steel punch always steals,</text><text class="wf-txt sm c" x="249.0" y="188">then you shrug off stuns.</text><rect class="wf-box" x="324" y="66" width="134" height="146"/><rect class="wf-box acc" x="328" y="70" width="12" height="11"/><text class="wf-txt sm c on-acc" x="334" y="79">3</text><rect class="wf-box flat" x="359.0" y="71" width="64" height="12"/><text class="wf-txt sm c" x="391.0" y="80">STRIKER</text><rect class="wf-ph" x="326" y="88" width="130" height="56"/><g class="wf-pitch"><line x1="391.0" y1="88" x2="391.0" y2="144"/><circle cx="391.0" cy="116" r="16"/></g><text class="wf-txt md c" x="391.0" y="162">Dragon Curl</text><text class="wf-txt sm c" x="391.0" y="178">Shots curl toward the corner</text><text class="wf-txt sm c" x="391.0" y="188">on a green dragon.</text><rect class="wf-box" x="466" y="66" width="134" height="146"/><rect class="wf-box acc" x="470" y="70" width="12" height="11"/><text class="wf-txt sm c on-acc" x="476" y="79">4</text><rect class="wf-box flat" x="501.0" y="71" width="64" height="12"/><text class="wf-txt sm c" x="533.0" y="80">SPEED</text><rect class="wf-ph" x="468" y="88" width="130" height="56"/><g class="wf-pitch"><line x1="533.0" y1="88" x2="533.0" y2="144"/><circle cx="533.0" cy="116" r="16"/></g><text class="wf-txt md c" x="533.0" y="162">Speed Demon</text><text class="wf-txt sm c" x="533.0" y="178">Quicker off the ball, and</text><text class="wf-txt sm c" x="533.0" y="188">you crackle sooner.</text><text class="wf-txt sm c mute" x="320" y="230">YOUR BUILD</text><rect class="wf-box hi" x="298" y="236" width="20" height="20"/><text class="wf-txt sm c ink" x="308" y="249">1</text><rect class="wf-box dim" x="321" y="236" width="20" height="20"/><text class="wf-txt sm c" x="331" y="249">2</text><rect class="wf-box dim" x="298" y="259" width="20" height="20"/><text class="wf-txt sm c" x="308" y="272">3</text><rect class="wf-box dim" x="321" y="259" width="20" height="20"/><text class="wf-txt sm c" x="331" y="272">4</text><rect class="wf-ln dash" x="232" y="318" width="176" height="34"/><g class="wf-pin"><circle cx="612" cy="76" r="7"/><text x="612" y="79">1</text></g><g class="wf-pin"><circle cx="384" cy="51" r="7"/><text x="384" y="54">2</text></g><g class="wf-pin"><circle cx="256" cy="35" r="7"/><text x="256" y="38">3</text></g><g class="wf-pin"><circle cx="150" cy="100" r="7"/><text x="150" y="103">4</text></g><g class="wf-pin"><circle cx="418" cy="326" r="7"/><text x="418" y="329">5</text></g></svg>